name = "CWFlow"
version = "0.1.0"
keywords = ["math", "lagrangian", "geometric-flow", "short-time-existence"]
defaultTargets = ["CWFlow"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Short-time existence for higher-order parabolic equations (../MM, which pins
# DifferentialGeometry v0.1.3 and Mathlib v4.33.1). Packages are shared with ../MM.
[[require]]
name = "ShortTime"
path = "../MM"

[[lean_lib]]
name = "CWFlow"
